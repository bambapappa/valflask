allowlist_domains:
  - riksdagen.se
  - data.riksdagen.se
  - regeringen.se
  - socialdemokraterna.se
  - moderaterna.se
  - sd.se
  - centerpartiet.se
  - val2026.centerpartiet.se
  - vansterpartiet.se
  - kristdemokraterna.se
  # Underdomän: G2 kräver exakt domänmatch, så pressrummet måste stå för sig.
  - press.kristdemokraterna.se
  - liberalerna.se
  - mp.se
  - dn.se
  - svd.se
  - svt.se
  - sverigesradio.se
  - tt.se
  - altinget.se
  - expressen.se
  - aftonbladet.se
  - gp.se
  - di.se

# Partiernas egna domäner. Enda effekten: ett citat som är en HEL, unik punkt
# på partiets egen sida får vara kortare än fem ord ("Skrota enprocentsregeln").
# På en nyhetssida gäller alltid femordsgolvet — där är en kort rad en rubrik
# eller en bildtext, inte ett löfte.
parti_domaner:
  - socialdemokraterna.se
  - moderaterna.se
  - sd.se
  - centerpartiet.se
  - val2026.centerpartiet.se
  - vansterpartiet.se
  - kristdemokraterna.se
  - press.kristdemokraterna.se
  - liberalerna.se
  - mp.se

feeds:
  # --- Partier (verifierade 2026-06-12 via live HTTP) ---
  - id: moderaterna
    type: rss
    url: "https://moderaterna.se/feed/"
    verified: "2026-06-12 — 200, RSS 2.0, WordPress"

  - id: sverigedemokraterna
    type: rss
    url: "https://www.sd.se/feed/"
    verified: "2026-06-12 — 200, RSS 2.0, WordPress"

  - id: vansterpartiet
    type: rss
    url: "https://www.vansterpartiet.se/feed/"
    verified: "2026-06-12 — 200, RSS 2.0, WordPress"

  - id: liberalerna
    type: rss
    url: "https://www.liberalerna.se/feed/"
    verified: "2026-06-12 — 200, RSS 2.0, WordPress"

  # Frågetecknet är INTE dekoration. Ändpunkten svarar 200 med tio poster i
  # båda fallen, men den PARAMETERLÖSA adressen serverar en cachad kopia:
  # mätt 2026-08-03 slutade den på 2026-06-26 medan sajten var uppe på 08-03.
  # Vilken parameter som helst går förbi cachen (?limit=, ?x=1, ?cb= — alla gav
  # samma färska innehåll), så det är cachenyckeln som skiljer, inte limit.
  # Utan den här raden tappade vi fem veckors MP-nyheter tyst: flödet såg friskt
  # ut hela tiden. Byt aldrig tillbaka till den nakna adressen.
  - id: miljopartiet
    type: rss
    url: "https://www.mp.se/wp-content/themes/mp/assets/php/rss/rss-news.php?limit=50"
    verified: "2026-08-03 — 200, RSS, custom PHP endpoint; nyaste post 2026-08-03 MED parameter, 2026-06-26 utan"

  # Socialdemokraterna och Centerpartiet: INGEN RSS finns. Omprövat 2026-08-03
  # — varken /rss, /feed, /nyheter/rss, MyNewsdesk eller ett pressrum svarar,
  # och sidorna pekar inte ut något flöde via <link rel="alternate">. Båda kör
  # SiteVision och renderar nyhetslistan utan flödesstöd.
  #
  # DET KOSTAR TÄCKNING, och det är mätt 2026-08-03: sedan vårt nyaste
  # S-löfte (2026-07-17) har S publicerat minst tre nyheter, två av dem samma
  # dag — bl.a. "Socialdemokraterna går till val på en nationell modell för…".
  # C har publicerat fem sedan dess, bl.a. totalförbud mot PFAS och åldersgräns
  # på sociala medier. Ingen av dem har nått oss.
  #
  # De två partierna utan flöde är alltså precis de två med äldst egen-täckning.
  # Att fånga dem kräver att en nyhetslista får följas till artiklarna — samma
  # sorts steg som auto-följningen av manifest-PDF:er, fast för HTML. Se
  # HANDOFF.md; det är ett eget spår och ett mänskligt beslut.
  # Kristdemokraterna: ingen RSS på egna sajten (SiteVision), men pressrummet
  # (Notified) har ett riktigt flöde — se kd-press nedan.

  - id: kd-press
    type: rss
    url: "https://api.client.notified.com/api/rss/publish/view/18224?type=press"
    verified: "2026-08-03 — 200, text/xml, RSS 2.0, 50 poster, nyaste 2026-07-16; artiklarna ligger på press.kristdemokraterna.se och serveras med text i HTML (≈1 500 tecken), alltså över min_chars"
    # Flödet självt ligger hos Notified, men VARJE artikel pekar tillbaka på
    # press.kristdemokraterna.se — och det är artikelns domän G2 prövar.
    # Utan den här källan hade KD bara 22 löften, 18 av dem ur ett SVT-program
    # och 2 från egna sajten, med nyaste löfte 2026-07-04 medan M, SD, L och MP
    # var aktuella till 2026-08-03.

  # --- Nyhetslistor för partier utan flöde (type: index) ---
  # S, C och KD kör SiteVision och publicerar varken RSS eller Atom. Deras
  # artikeladresser bär däremot datum, och "index"-typen följer listan till
  # artiklarna. Mätt 2026-08-03: listan gav 3, 5 respektive 3 artiklar, och
  # varje artikel serverar 2 200–4 000 tecken text — långt över min_chars.
  #
  # M, SD, V, L och MP saknas här med flit: deras adresser är odaterade slugar,
  # så datumkravet ger noll träffar. De har fungerande RSS i stället, och att
  # gissa artikellänkar utan datum hade dragit in menyer och taggsidor.

  # S — /nyheter renderas med skript och ger noll länkar; startsidan listar de
  # senaste artiklarna i HTML och är därför ingången.
  - id: s-nyheter
    type: index
    url: "https://www.socialdemokraterna.se/"
    verified: "2026-08-03 — 200, 3 daterade artiklar (nyaste 2026-08-03), 3 400–4 000 tecken per artikel"

  - id: c-nyheter
    type: index
    url: "https://www.centerpartiet.se/nyheter"
    verified: "2026-08-03 — 200, 5 daterade artiklar (nyaste 2026-07-31), ca 2 800 tecken per artikel"

  # KD har pressrummet ovan; startsidan är en andra väg in till partiets egna
  # nyheter, som inte ligger i pressflödet.
  - id: kd-nyheter
    type: index
    url: "https://kristdemokraterna.se/"
    verified: "2026-08-03 — 200, 3 daterade artiklar"

  # KD:s "Vår politik" är en MENY, inte en politiksida: 4 670 tecken, nästan
  # bara länketiketter. Den har hämtats fyra gånger och gett noll kandidater —
  # inte ens en avvisad. Politiken ligger på undersidorna, och utan dem kom 18
  # av KD:s 24 löften ur ett enda SVT-program medan bara 21 % kom från partiets
  # egen kanal (mätt 2026-08-04; övriga partier låg på 61–100 %).
  #
  # Mönstret utesluter fyra undersidor som inte bär politik: teckenspråk,
  # lättläst och andra språk är samma innehåll i annan form, och
  # rapporter-och-dokument är en länklista.
  - id: kd-politik-index
    type: index
    url: "https://kristdemokraterna.se/var-politik"
    article_pattern: "^/var-politik/(?!teckensprak|lattlast|kd-pa-andra-sprak|rapporter-och-dokument)"
    verified: "2026-08-04 — 200, 12 undersidor varav 8 efter mönstret; politikomraden 11 336 tecken, politik-a-till-o 17 166, en-budget-for-familjen 4 951"

  # KD:s A–Ö är en KATALOG, inte en nyhetslista: 220 undersidor, en per
  # sakfråga, och det är där partiets faktiska ställningstaganden står.
  # Källan ovan följer den bara som EN sida — själva registret, alltså
  # länketiketter utan politik.
  #
  # Det kostade oss ett publicerat vallöfte, och det upptäcktes av en läsare
  # och inte av oss: KD gick 2026-05-07 till val på att stegvis avskaffa
  # reavinstskatten på bostäder. Beskedet kom före vårt skördefönster, så
  # nyheten fanns aldrig i något flöde vi läser — men politiken står kvar på
  # /var-politik/politik-a-till-o/reavinstskatt och har gjort det hela tiden.
  # Vi hämtade registret som pekade dit fyra gånger utan att någon gång öppna
  # sidan.
  #
  # max_articles finns för den här sortens källa. Tolvtaket är byggt för
  # färskvara; mot en katalog i bokstavsordning blir det inte en fördröjning
  # utan ett hårt tak vid "arbetsratt". 250 rymmer alla 220 med marginal för
  # att KD lägger till fler. LLM-budgeten skyddas av maxNewArticles i
  # runPipeline, inte av det här talet: oförändrade sidor faller på dedup.
  - id: kd-politik-a-till-o
    type: index
    url: "https://kristdemokraterna.se/var-politik/politik-a-till-o"
    article_pattern: "^/var-politik/politik-a-till-o/."
    max_articles: 250
    verified: "2026-08-10 — 200, 184 937 tecken, 220 undersidor efter mönstret; reavinstskatt 1 006 tecken text"

  # --- Nyhetslistor för partier SOM HAR flöde (andra vägen in) ---
  # Efter att MP:s flöde visade sig servera en fem veckor gammal cache utan att
  # något syntes är en enda väg in per parti inte betryggande. De här källorna
  # är redundans: går flödet tyst fortsätter nyheterna komma. Adresserna är
  # odaterade slugar, så varje källa pekar ut sitt eget artikelprefix i stället
  # för att luta sig mot datumkravet.

  - id: m-nyheter
    type: index
    url: "https://moderaterna.se/nyheter/"
    article_pattern: "^/nyhet/"
    verified: "2026-08-03 — 200, 11 artiklar; datum ur article:published_time i artikeln"

  - id: v-nyheter
    type: index
    url: "https://www.vansterpartiet.se/nyheter/"
    article_pattern: "^/nyheter/(?!page/)"
    verified: "2026-08-03 — 200, 9 artiklar"

  - id: l-nyheter
    type: index
    url: "https://www.liberalerna.se/nyheter/"
    article_pattern: "^/nyheter/(?!page/)"
    verified: "2026-08-03 — 200, 8 artiklar"

  - id: mp-nyheter
    type: index
    url: "https://www.mp.se/just-nu/"
    article_pattern: "^/just-nu/"
    verified: "2026-08-03 — 200, 12 artiklar; datum ur <time datetime> i artikeln"

  # SD saknas här: både /nyheter/ och startsidan bygger artikellistan med
  # skript, så HTML:en bär bara paginering (/nyheter/page/2/ …). Ingenting att
  # följa. SD:s RSS fungerar och var aktuell 2026-08-01 — kontrollerat samma
  # dag. Blir listan någon gång serverrenderad går den att lägga till här med
  # samma mönster som V och L.

  # --- Riksdagen API (verifierade 2026-06-12 via live HTTP) ---
  - id: riksdagen-motioner
    type: riksdagen_api
    url: "https://data.riksdagen.se/dokumentlista/?doktyp=mot&utformat=json&sort=datum&a=S%C3%A5Sedan"
    verified: "2026-06-12 — 200, JSON, 257928 träffar, sidor 12897"

  - id: riksdagen-anforanden
    type: riksdagen_api
    url: "https://data.riksdagen.se/anforandelista/?utformat=json&a=S%C3%A5Sedan"
    verified: "2026-06-12 — 200, JSON, separat endpoint (ej dokumentlista)"

  # --- Medier (verifierade 2026-06-12 via live HTTP) ---
  - id: dn-politik
    type: rss
    url: "https://www.dn.se/rss/politik"
    verified: "2026-06-12 — 200, RSS 2.0, dedikerad svensk politik"

  - id: sr-ekot
    type: rss
    url: "https://api.sr.se/api/rss/program/4540"
    verified: "2026-06-12 — 200, Atom, Ekot program 4540"

  - id: svt-nyheter
    type: rss
    url: "https://www.svt.se/rss.xml"
    verified: "2026-06-12 — 200, RSS 2.0, bred nyhetstäckning med politik"

  - id: di
    type: rss
    url: "https://www.di.se/rss"
    verified: "2026-06-12 — 200, RSS 2.0, ekonomi/politik-overlap"

  # SvD: INGEN offentlig RSS hittad (404 på /rss, /feed, /nyheter/rss).
  # Expressen, Aftonbladet, GP, Altinget, TT: ej testade i denna omgång;
  # kan läggas till efter verifiering.

  # --- Skrivna manifest/policysidor (page) ---
  # Partiernas skrivna löften finns inte som RSS. "page"-typen hämtar en HTML-sida
  # ELLER PDF, extraherar text och kör LLM-extraktion + grindarna. Sidorna
  # ändringsbevakas (contentHash i seen) och manifest-PDF:er länkade från en sida
  # auto-följs (samma domän, .pdf + manifest/valplattform/valprogram i sökvägen).
  # DÄRFÖR ska VARJE parti ha minst en valsida här även innan manifestet släppts:
  # den dag partiet länkar sin manifest-PDF fångas den automatiskt.
  # Läge 2026-07-03: fullt manifest publicerat av C (96 s.), L (40 s.);
  # valplattform av S (4 s.), V (4 s.); MP har HTML-utkast; M/SD/KD ej ännu.

  # C — fullt manifest (PDF) + sammanfattningssida
  - id: c-valmanifest
    type: page
    url: "https://val2026.centerpartiet.se/"
    verified: "2026-07-02 — 200, Centerpartiets valmanifest 2026 (sammanfattningssida; länkar PDF:en)"
  - id: c-valmanifest-pdf
    type: page
    url: "https://val2026.centerpartiet.se/wp-content/uploads/2026/06/Valmanifest-2026.pdf"
    verified: "2026-07-03 — 200, application/pdf, 96 s. — hela valmanifestet (sha256 69013e13c1ab…)"

  # S — valplattform (PDF) + val-2026-sida (länkar PDF:en; ingen RSS)
  - id: s-valmanifest
    type: page
    url: "https://www.socialdemokraterna.se/val-2026"
    verified: "2026-07-03 — 200, S:s val-2026-sida; länkar Valplattform.pdf"
  - id: s-valplattform-pdf
    type: page
    url: "https://www.socialdemokraterna.se/download/18.68544bb219c4794c4a4684c/1771599906618/Valplattform.pdf"
    verified: "2026-07-03 — 200, application/pdf, 4 s., CreationDate 2026-02-04"

  # M — inget valmanifest publicerat ännu; politiksidan bevakas (auto-följ tar PDF:en när den släpps)
  - id: m-politik
    type: page
    url: "https://moderaterna.se/var-politik/"
    verified: "2026-08-03 — 200, M:s politiksida; valmanifest 2026 ej publicerat (/valmanifest/ svarar 200 men serverar samma politiksida)"

  # SD — inget valmanifest publicerat ännu; politiksidan bevakas
  - id: sd-vadvivill
    type: page
    url: "https://sd.se/vad-vi-vill/"
    verified: "2026-08-03 — 200, SD:s politik; valmanifest 2026 ej publicerat. OBS: /valmanifest/ leder vidare till 2022 års manifest-PDF — stoppas av årsspärren"

  # V — valplattform beslutad på kongressen 2026 (PDF) + valsida
  - id: v-val2026
    type: page
    url: "https://www.vansterpartiet.se/val2026/"
    verified: "2026-07-03 — 200, V:s valsida"
  - id: v-valplattform-pdf
    type: page
    url: "https://www.vansterpartiet.se/wp-content/uploads/2026/04/Preliminar-Valplattform-efter-beslut-pa-kongressen-2026.pdf"
    verified: "2026-07-03 — 200, application/pdf, 4 s., CreationDate 2026-04-19"

  # KD — inget valmanifest publicerat ännu; politiksidan bevakas.
  # OBS: sidan länkar 'Manifesto_2024.pdf' från EU-valet. Den matchar
  # nyckelorden för auto-följning men stoppas av årsspärren (VALAR i fetch.ts).
  - id: kd-politik
    type: page
    url: "https://kristdemokraterna.se/var-politik"
    verified: "2026-08-03 — 200, KD:s politiksida; valmanifest 2026 ej publicerat (/valmanifest ger 404)"

  # L — fullt valmanifest 'För din frihet' (PDF) + manifestsida (länkar PDF:en)
  - id: l-valmanifest
    type: page
    url: "https://www.liberalerna.se/liberalernas-valmanifest-2026"
    verified: "2026-07-03 — 200, L:s manifestsida; länkar PDF:en"
  - id: l-valmanifest-pdf
    type: page
    url: "https://www.liberalerna.se/wp-content/uploads/liberalernas-valmanifest-2026-40s-komprimerad.pdf"
    verified: "2026-07-03 — 200, application/pdf, 40 s., CreationDate 2026-06-02"

  # MP — valmanifest 2026 ännu ej offentligt (utkastsidan är lösenordsskyddad);
  # politiksidan bevakas + politiskt handlingsprogram 2026–2030 (beslutat, PDF)
  - id: mp-politik
    type: page
    url: "https://www.mp.se/politik/"
    verified: "2026-08-03 — 200, MP:s politiksida; valmanifest 2026 ej publicerat. OBS: /valmanifest/ är sidan 'Valmanifest 2022' — dess PDF stoppas av årsspärren"
  - id: mp-handlingsprogram-pdf
    type: page
    url: "https://www.mp.se/wp-content/uploads/2026/04/politiskt-handlingsprogram-2026-2030.pdf"
    verified: "2026-07-03 — 200, application/pdf — politiskt handlingsprogram 2026–2030"
  - id: mp-almedalstal
    type: page
    url: "https://www.mp.se/just-nu/daniel-helldens-almedalstal/"
    verified: "2026-07-02 — 200, Daniel Helldéns Almedalstal (skriven)"
  - id: mp-matstrategi
    type: page
    url: "https://www.mp.se/just-nu/miljopartiet-ny-strategi-for-fossilfri-matproduktion-starker-sveriges-beredskap/"
    verified: "2026-07-02 — 200, MP fossilfri matproduktion"

limits:
  max_articles_per_run: 20
  min_chars: 400
