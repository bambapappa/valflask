name: arkiv
# Arkivskörd + verifiering på GitHubs runners (fritt utnät): hämtar en
# arkivögonblicksbild av varje vägt dokument och KONTROLLERAR att kopplingens
# citat står ord för ord i kopian (kärnprincipen "arkivlänkar måste bära
# citatet"). Delsparar per handling och committar bara data/arkiv.json —
# kopplingar, kön och skördefilerna rörs aldrig här, så ett samtidigt
# granskningsbeslut kan inte skrivas över. En HV5-checklistepunkt.
#
# SCHEMALAGD KÖRNING: veckovis, en timme efter foreslag.yml samma dag, så
# veckans godkända kopplingar (H6, oavsett om de godkänts via granska-CLI:t
# eller issue-flödet) hinner få arkivkopia utan att någon behöver komma
# ihåg att trycka på knappen.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max antal handlingar att pröva denna körning (tomt = alla)"
        required: false
        default: ""
  schedule:
    - cron: "0 8 * * 1"
permissions:
  contents: write
concurrency:
  group: arkiv
  cancel-in-progress: false
jobs:
  arkivera:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Alla run-steg utan egen working-directory kör ur Handlingsvågens
        # rot, så relativa sökvägar (data/, cd pipeline) betyder samma sak
        # som före sammanslagningen.
        working-directory: handlingsvagen
    timeout-minutes: 120
    steps:
      - name: Mint bot app token
        id: app-token
        # Efter sammanslagningen pushar den här körningen till valflasks main,
        # där direktpush kräver botens token (samma väg som pipeline.yml).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: handlingsvagen/pipeline
      - name: Arkivskörd + verifiering
        id: arkiv
        continue-on-error: true
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          npm run arkiv -- "${args[@]}"
        working-directory: handlingsvagen/pipeline
      - name: Committa data/arkiv.json
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/arkiv.json /tmp/arkiv.json 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH" && git reset --hard "origin/$DEFAULT_BRANCH"
            [ -e /tmp/arkiv.json ] && cp /tmp/arkiv.json data/arkiv.json || true
            git add data/arkiv.json
            if git diff --cached --quiet; then
              echo "Inga nya arkivposter."
              exit 0
            fi
            git commit -m "data: arkivskörd via workflow"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades — gör om från färsk defaultgren..."
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1
      - name: Fall röd om arkivsteget föll
        if: steps.arkiv.outcome == 'failure'
        run: |
          echo "Arkivsteget föll — delresultat är committade, omkörning fortsätter där det slutade."
          exit 1
