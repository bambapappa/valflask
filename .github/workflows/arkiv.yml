name: arkiv
# Arkivskörd + verifiering på GitHubs runners (fritt utnät): hämtar en
# arkivögonblicksbild av varje vägt dokument och KONTROLLERAR att kopplingens
# citat står ord för ord i kopian (kärnprincipen "arkivlänkar måste bära
# citatet"). Startas för hand. Delsparar per handling och committar bara
# data/arkiv.json — kopplingar, kön och skördefilerna rörs aldrig här, så ett
# samtidigt granskningsbeslut kan inte skrivas över. En HV5-checklistepunkt.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max antal handlingar att pröva denna körning (tomt = alla)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: arkiv
  cancel-in-progress: false
jobs:
  arkivera:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: pipeline
      - name: Arkivskörd + verifiering
        id: arkiv
        continue-on-error: true
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          npm run arkiv -- "${args[@]}"
        working-directory: pipeline
      - name: Committa data/arkiv.json
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/arkiv.json /tmp/arkiv.json 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH" && git reset --hard "origin/$DEFAULT_BRANCH"
            [ -e /tmp/arkiv.json ] && cp /tmp/arkiv.json data/arkiv.json || true
            git add data/arkiv.json
            if git diff --cached --quiet; then
              echo "Inga nya arkivposter."
              exit 0
            fi
            git commit -m "data: arkivskörd via workflow"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades — gör om från färsk defaultgren..."
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1
      - name: Fall röd om arkivsteget föll
        if: steps.arkiv.outcome == 'failure'
        run: |
          echo "Arkivsteget föll — delresultat är committade, omkörning fortsätter där det slutade."
          exit 1
