# Källröta-bevakningen — BÅDA vågarna, veckovis (SPEC-FRAGEVAGEN.md §6.3).
#
# Fläskvågens steg tillkom 2026-08-09. Verktyget fanns sedan femtonde passet
# men låg i inget arbetsflöde, så metodsidans «sedan öppnar vi källorna igen,
# regelbundet» gällde bara Frågevågen: 553 löftens källor öppnades en enda
# gång, för hand. Nu gäller meningen båda. Ankaret som vaktar den ligger i
# site/src/lib/prosans-ankare.ts.
#
# VILANDE TILLS LANSERING (ops/FRAGEVAGEN-LANSERING.md steg 4): jobbet kör bara
# när repovariabeln STANCES_ENABLED är "true" — schemat kan alltså mergas utan
# att något händer. Re-hämtar källorna för publicerade besked; borttagna eller
# omskrivna källor stämplas synligt (arkivkopian gäller). Tyst rättelse är
# förbjuden — statusändringar committas som data och syns på sajten.
name: rot-watch
on:
  schedule:
    - cron: "40 4 * * 1"   # måndagar 04:40 UTC (efter helgen, före veckans första pipeline-körning)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: rot-watch, cancel-in-progress: false }
jobs:
  check:
    if: ${{ vars.STANCES_ENABLED != 'false' }}  # samma default-PÅ som pipeline.yml; ofarlig no-op tills besked finns
    runs-on: ubuntu-latest
    steps:
      - name: Mint bot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4  # samma pin-undantag som pipeline.yml (2026-06-15)
        with:
          version: 9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pipeline/pnpm-lock.yaml
      - name: Install pipeline deps
        run: pnpm install --frozen-lockfile
        working-directory: pipeline
      - name: Källröta-kontroll — Frågevågen
        run: pnpm stances:rot-check
        working-directory: pipeline
      # `--fynd-ar-data`: en ändrad källa är ett mätvärde, inte ett haveri.
      # Utan flaggan hade jobbet fallit varje måndag på de tre löften som
      # redan står `andrad`, larmet gått för ett känt läge, och committen
      # nedan hoppats över — bevakningen hade mätt och kastat mätningen.
      # Faller steget ändå är bevakningen verkligen trasig, och då ska larmet gå.
      - name: Källröta-kontroll — Fläskvågen
        run: pnpm promises:rot-check --fynd-ar-data
        working-directory: pipeline
      - name: Commit data if changed
        run: |
          git config user.name "utlovat-bot" && git config user.email "bot@utlovat.se"
          git add data/stances.json data/promises.json data/changelog.json
          if git diff --cached --quiet; then
            echo "Inga dataändringar — inget att committa."
            exit 0
          fi
          git commit -m "data: källröta-kontroll $(date -u +%F) (run ${{ github.run_id }})"
          # main går vidare under körningen — pipelinen, skörden och
          # review-besluten pushar hit hela dygnet. Här stod förut en naken
          # `git push`, och 2026-08-17 föll bevakningen på precis det: en
          # annan körning hann före med 21 sekunder, pushen avvisades som
          # non-fast-forward, och veckans rötmätning kastades. Larmet gick
          # för något som inte var trasigt.
          #
          # `git rebase --abort` i loopen är inte prydnad. Faller rebasen på
          # en konflikt står trädet kvar i rebase-läge, och varje följande
          # `git pull` svarar «Pulling is not possible because you have
          # unmerged files» — försök 2 till 5 kan då inte lyckas ens i
          # teorin. Det är den fällan pipeline.yml gick i samma morgon.
          for forsok in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Push lyckades (försök $forsok)."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push-försök $forsok misslyckades (main har troligen gått vidare). Försöker igen..."
            sleep $((forsok * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1

  # Larmet är hela skälet till att ett fel i den här körningen syns för en
  # människa. Delad implementation i larm.yml — lägg aldrig en kopia här.
  larm:
    needs: [check]
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/larm.yml
    with:
      rubrik: "Källrötebevakningen"
      etikett: "larm-rot-watch"
      atgard: |
            Bevakningen stämplar källor som ändrats eller försvunnit, i båda
            vågarna. Faller den syns en borttagen källa inte på sajten. Kör
            `pnpm stances:rot-check --dry-run` respektive
            `pnpm promises:rot-check --dry-run` i `pipeline/` och läs vad som
            brister innan något skrivs. **Ett fynd fäller inte jobbet** —
            faller det är det bevakningen som är trasig, inte en källa.
