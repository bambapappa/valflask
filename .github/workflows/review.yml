name: review
# Granskningsbeslut via issue-kommentarer: /godkänn, /godkänn <low> <base> <high>,
# /godkänn --group p-2026-XXXX, /avvisa <skäl>. Endast repo-ÄGARENS kommentarer
# på issues med etiketten "review-kö" exekveras — allt annat i issuet är data.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
# INGEN concurrency-grupp: GitHub håller bara EN köad körning per grupp och
# slänger mellanliggande — snabba beslut i rad skulle tappas. Parallella
# körningar är säkra: handlern görs om från färsk main tills pushen lyckas,
# och en redan hanterad post svarar "redan hanterad" i stället för dubbelkörs.
jobs:
  # En tyst avvisning är värre än ett felsvar.
  #
  # Grinden på `handle` släpper bara ägarens kommandon, och när den fäller
  # något händer INGENTING: körningen står som «skipped», kommentaren ligger
  # kvar och ser besvarad ut, och den som skrev den tror att beslutet är
  # fattat. Mätt 2026-09-01: fyrtio `/avvisa` postades av `claude[bot]`
  # (author_association `NONE` — inte samma identitet som ägarens
  # GitHub-verktyg). Alla fyrtio hoppades över, kön var oförändrad, och det
  # syntes bara för att någon läste körningarnas utfall efteråt. Hade ingen
  # gjort det vore fyrtio beslut rapporterade som fattade utan att vara det.
  #
  # Jobbet nedan svarar i stället. Det rör ingen data och kan inte fatta
  # något beslut — det säger bara att kommandot inte gjorde något, och varför.
  # Svaret börjar inte med «/», så det kan inte utlösa sig självt.
  #
  # Villkoret är med flit `handle`:s spegelbild: samma två krav, motsatt
  # behörighetsjämförelse. `tests/review-grinden.test.ts` mäter att de
  # förblir varandras spegelbild, så att ett `/`-kommando på ett kö-issue
  # alltid träffar exakt ett av jobben och aldrig faller mellan dem.
  ej_behorig:
    if: >
      contains(github.event.issue.labels.*.name, 'review-kö') &&
      github.event.comment.author_association != 'OWNER' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Säg att kommandot inte exekverades
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          FORFATTARE: ${{ github.event.comment.user.login }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "⚠️ Kommandot ovan **exekverades inte**. Review-beslut tas bara emot från repots ägare, och kommentaren kom från \`$FORFATTARE\`. Kön är oförändrad och posten väntar fortfarande på ett beslut."

  handle:
    if: >
      contains(github.event.issue.labels.*.name, 'review-kö') &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - name: Mint bot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          # Se h2-svep.yml: inga sparade uppgifter, färsk token i origin-URL:en.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: pnpm install --frozen-lockfile
        working-directory: pipeline
      # App-tokens lever en timme — mynta en färsk precis före pushen.
      - name: Mint fresh push token
        id: push-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
      - name: Execute decision and push
        id: decision
        # Kommentar/titel går som miljövariabler in i Node — ALDRIG interpolerade
        # i shellkod (citat ur manifest + fritext är opålitlig data). Vid push-
        # race (parallellt beslut/pipelinekörning) görs HELA beslutet om från
        # färsk main — aldrig rebase av JSON-datafiler.
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          git config user.name "utlovat-bot"
          git config user.email "bot@utlovat.se"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            # Hämtningen MÅSTE lyckas. Går den inte fram står vi kvar på ett
            # gammalt träd, och då kan en misslyckad push se ut som
            # "inget nytt att committa" — grön körning, tom push.
            if ! git fetch origin main; then
              echo "försök $attempt: kunde inte hämta main"
              sleep $((attempt * 5))
              continue
            fi
            git reset --hard origin/main
            (cd pipeline && node --import tsx/esm scripts/handle-review-comment.mts)
            # LÄSKOPIAN FÖLJER LÖFTENA, OCH ETT GODKÄNNANDE PUBLICERAR ETT LÖFTE.
            # Handlingsvågen läser sin egen kopia av Fläskvågens löften, och
            # `laskopian.test.ts` fäller den så snart den glidit. Samma rättelse
            # gjordes i review-apply.yml 2026-08-30, men BARA där — och den här
            # workflown publicerar löften på precis samma sätt. Fyra godkännanden
            # via issue-kommentar lämnade main röd 2026-09-01, och felet syntes
            # först när någon körde provsviten.
            #
            # Bygget är billigt och idempotent: kopian härleds ur promises.json,
            # så ändrades inget löfte ändras ingenting här, och `git diff
            # --cached` nedan avgör som förut om något ska committas.
            node --experimental-strip-types handlingsvagen/pipeline/scripts/bygg-vendor.mts
            git add data/ handlingsvagen/data/
            if git diff --cached --quiet; then
              echo "Inga dataändringar (fel-/hjälpsvar eller redan hanterad)."
              exit 0
            fi
            git commit -m "data: review-beslut via issue #${{ github.event.issue.number }}"
            if git push; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades (main gick vidare) — gör om från färsk main..."
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1
      # `if: always()` — och det är hela poängen med steget.
      #
      # Handlern svarar med ett grönt jobb och en förklarande kommentar när
      # beslutet inte går att verkställa. Men EN väg gör det inte:
      # kvalitetsfiltret inne i `approve()` avslutar processen med kod 1. Då
      # faller steget ovan, det här steget hoppas över, och issuet får ingen
      # kommentar alls — kommandot ligger kvar och ser besvarat ut.
      #
      # Mätt 2026-09-01: fyra `/godkänn` föll på att prövningens hash beskrev
      # en annan version av posten. Alla fyra körningar blev röda, alla fyra
      # issues tysta, och det syntes bara för att någon läste körningarnas
      # utfall efteråt. Samma tystnad som `ej_behorig` finns för att stoppa,
      # bara en annan väg in i den.
      #
      # Nu svarar steget även när beslutet föll. Saknas `result` är det
      # körningen som brutit, inte handlern — och då säger kommentaren det och
      # pekar på körningen, i stället för att ingenting sägs.
      - name: Reply and close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.decision.outputs.result }}
          MESSAGE: ${{ steps.decision.outputs.message }}
          ISSUE: ${{ github.event.issue.number }}
          KORNING: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            "")
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
                "⚠️ Kommandot ovan **exekverades inte** — körningen bröt innan beslutet skrevs. Kön är oförändrad och posten väntar fortfarande på ett beslut. Skälet står i [körningen]($KORNING)."
              ;;
            approved)
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "✅ $MESSAGE"
              gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
              ;;
            rejected)
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "❌ $MESSAGE"
              gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"
              ;;
            *)
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "⚠️ $MESSAGE"
              ;;
          esac
