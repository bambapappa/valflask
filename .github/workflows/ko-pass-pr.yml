name: ko-pass-pr
# Öppnar PR:en åt det schemalagda kö-passet.
#
# Passet kör skillarna, prövar kön och pushar en gren — men den sessionen har
# inga GitHub-verktyg och kan därför inte öppna en PR själv. Mätt 2026-08-09:
# en schemalagd session får varken `add_repo` eller GitHub-verktygen, och
# fastnar på en behörighetsfråga som ingen besvarar klockan 05.30. Att pusha en
# gren klarar den; resten gör det här.
#
# Poängen är att göra passet OBEROENDE av vilka verktyg det råkar ha. Ett
# arbetsflöde som lyssnar på en pushad gren fungerar likadant vare sig grenen
# kommer från en schemalagd körning, en interaktiv session eller en människa.
on:
  push:
    branches:
      - "arbete/ko-pass-**"
permissions:
  contents: read
concurrency:
  # Per gren: två pushar i rad ska inte kunna skapa två PR:er för samma gren.
  group: ko-pass-pr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  oppna:
    runs-on: ubuntu-latest
    steps:
      # Bot-token, inte github.token. En PR som öppnas med jobbets egen token
      # triggar INGA andra arbetsflöden — GitHub blockerar den kedjan med flit —
      # och build.yml går på `pull_request`. Med github.token hade varje kö-pass
      # fått en PR helt utan CI, och det syns inte förrän någon undrar varför
      # rutan är tom.
      - name: Mint bot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Öppna PR om ingen redan finns
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GREN: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api() {
            metod="$1"; sokvag="$2"; shift 2
            curl -sS -X "$metod" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO$sokvag" "$@"
          }

          # Idempotent: finns redan en öppen PR för grenen är det inget att göra.
          # Kö-passet kan pusha flera gånger under ett pass, och varje push
          # landar här.
          befintlig=$(api GET "/pulls?state=open&head=${REPO%%/*}:$GREN" | jq -r '.[0].number // empty')
          if [ -n "$befintlig" ]; then
            echo "PR #$befintlig finns redan för $GREN — inget att göra."
            exit 0
          fi

          # Rubriken och texten kommer ur passets egen commit. Passet skriver
          # den; det här arbetsflödet hittar aldrig på något om innehållet.
          rubrik=$(git log -1 --pretty=%s)
          brodtext=$(git log -1 --pretty=%b)

          # Sammanslagningen är en människas beslut. Det ska stå i PR:en, inte
          # bara i en skill ingen läser vid rätt tillfälle — och ordningen med
          # kvalitetsfiltret är lätt att missa: grinden läser provningar.json
          # från main, så etikettbesluten fungerar först när det här är inne.
          {
            printf '%s\n\n' "$brodtext"
            printf -- '---\n\n'
            printf '**Öppnad av `ko-pass-pr` för grenen `%s`.**\n\n' "$GREN"
            printf 'Det schemalagda kö-passet kör skillarna och prövar kön, men kan inte öppna en PR själv — det här arbetsflödet gör det åt den.\n\n'
            printf '**Ordningen spelar roll:** kvalitetsfiltrets grind läser `data/provningar.json` från `main`. Ligger prövningarna kvar i den här grenen faller ägarens `beslut:godkänn` precis som om posten aldrig prövats. **Slå därför ihop den här PR:en innan etikettbesluten används.**\n\n'
            printf 'Passet har inte godkänt och inte avvisat någonting — besluten är kvar hos en människa, och sammanslagningen likaså.\n'
          } > /tmp/pr-body.md

          jq -n --arg t "$rubrik" --arg h "$GREN" --rawfile b /tmp/pr-body.md \
            '{title:$t, head:$h, base:"main", body:$b, draft:false}' > /tmp/pr.json

          # SVARET SKA STÅ I LOGGEN. Fram till 2026-08-29 slukade `jq -r
          # '.number // empty'` hela felkroppen, och steget skrev bara «Kunde
          # inte öppna PR». Larmet bad läsaren hämta API-svaret ur loggen — men
          # svaret fanns inte där. Elva dygn av larm gick därför inte att
          # avgöra: tolv körningar i rad föll utan att någon kunde se på vad.
          svar=$(api POST "/pulls" -d @/tmp/pr.json)
          nummer=$(printf '%s' "$svar" | jq -r '.number // empty')

          if [ -z "$nummer" ]; then
            fel=$(printf '%s' "$svar" | jq -r '[.message, (.errors[]?.message)] | map(select(.)) | join(" · ")')

            # Grenen är redan inne. Passet pushar flera gånger, och en push som
            # inte bär något nytt mot main är inget fel — det är «inget att
            # göra». Att larma på den hade lärt läsaren att ignorera larmet.
            case "$fel" in
              *"No commits between"*)
                echo "$GREN bär inget nytt mot main — ingen PR behövs."
                exit 0
                ;;
              *"pull request already exists"*)
                echo "En PR finns redan för $GREN — inget att göra."
                exit 0
                ;;
            esac

            echo "Kunde inte öppna PR för $GREN." >&2
            echo "GitHub svarade: ${fel:-<ingen message i svaret>}" >&2
            printf 'Hela svaret:\n%s\n' "$svar" >&2
            exit 1
          fi
          echo "Öppnade PR #$nummer för $GREN."

          api POST "/issues/$nummer/labels" -d '{"labels":["kö-pass"]}' > /dev/null || true

  # Larmet är hela skälet till att ett fel här syns för en människa. Utan det
  # kan passet pusha en gren, PR:en utebli, och kön se ut att vara obetad —
  # vilket är precis det tillstånd som är omöjligt att skilja från "inget att
  # göra". Delad implementation i larm.yml; lägg aldrig en kopia här.
  larm:
    needs: [oppna]
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/larm.yml
    with:
      rubrik: "PR:en åt det schemalagda kö-passet"
      etikett: "larm-ko-pass-pr"
      atgard: |
            Kö-passet har pushat en gren men PR:en öppnades inte, så arbetet
            ligger osynligt i grenen. Titta först efter grenen `arbete/ko-pass-*`
            och öppna PR:en för hand — innehållet är inte förlorat.

            Faller steget på behörighet är det bot-appen: den måste kunna skriva
            pull requests. Faller det på själva anropet, läs svaret från
            GitHub-API:t i loggen innan något ändras.
