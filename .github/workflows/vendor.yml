name: vendor
# Uppdaterar läskopian av Fläskvågens löften och partier (b-0019 a):
# data/loften-index.json + data/parties.json, skrivna ur valflasks publika
# data/promises.json och data/parties.json.
#
# VARFÖR EN EGEN WORKFLOW OCH INTE ETT STEG I BYGGET: b-0019 valde vendoring
# just för att sajten ska kunna byggas UTAN att nå in i systerrepot vid
# byggtid. Att låta hv-pages hämta löftena hade brutit det. Kopian uppdateras
# därför här, som all annan härledd data i repot (jämför arkiv.yml,
# nyckelord.yml) — bygget läser bara den incheckade filen.
#
# Kör den efter att valflask ändrat löften. Utan den blir kopian gammal åt två
# håll samtidigt: nya löften saknar rader i rutnätet, och tillbakadragna löften
# får rader de inte ska ha. Körningen är ofarlig — inget att committa räknas
# som lyckat.
#
# Vid en sammanslagning till ett repo försvinner både den här workflown och
# scripts/bygg-vendor.mts: löftena läses då direkt ur samma träd.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vendor
  cancel-in-progress: false
jobs:
  vendora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: bambapappa/valflask
          path: valflask-kalla
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: pipeline
      - name: Skriv om läskopian
        env:
          PROMISES_PATH: ${{ github.workspace }}/valflask-kalla/data/promises.json
          PARTIES_PATH: ${{ github.workspace }}/valflask-kalla/data/parties.json
        run: npm run vendor
        working-directory: pipeline
      - name: Sajtens grindar mot den nya kopian
        # Ändrade löften kan fälla budget- eller strukturgrindarna (skärvor som
        # växer, rader som försvinner). Bättre att det syns här än i hv-pages.
        run: |
          npm ci
          npm test
        working-directory: site
      - name: Committa kopian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/loften-index.json data/parties.json
          if git diff --cached --quiet; then
            echo "Kopian var redan i synk med valflask — inget att committa."
            exit 0
          fi
          git commit -m "data: uppdatera läskopian av löftena (b-0019)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades — hämtar om och lägger på nytt..."
            git fetch origin "${{ github.event.repository.default_branch }}"
            git rebase "origin/${{ github.event.repository.default_branch }}" || exit 1
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 3 försök."
          exit 1
