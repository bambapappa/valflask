name: foreslag
# Skarpa förslagskörningar (HV2) på GitHubs runners. Kräver i DETTA repo:
#   hemlighet  OPENROUTER_API_KEY   (Settings → Secrets and variables → Actions)
#   variabel   MODEL_KOPPLING       (samma ställe, fliken Variables)
# Valfria hemligheter: LLM_FALLBACK_BASE_URL, LLM_FALLBACK_API_KEY, och
# variabeln MODEL_KOPPLING_FALLBACK. Löftena läses ur publika valflask.
#
# Körningen är idempotent (par med förslag i kön hoppas över). Skriptet
# skriver kön efter varje löfte och kraschar inte på enskilda par, och
# körsteget är salvage-säkrat som i skord.yml: även om det faller committas
# det som hann köas, och körningen blir röd sist. Pushloopen lägger bara
# körningens NYA köposter på färsk defaultgren — ett granskningsbeslut som
# hann fattas under körningen återuppstår aldrig (scripts/ko-uppdatera.mts).
# Efter lyckad push synkas kön till issues.
on:
  workflow_dispatch:
    inputs:
      lofte:
        description: "Ett löftes-id (p-2026-XXXX) — tomt = alla aktiva"
        required: false
        default: ""
      max_kandidater:
        description: "Max kandidater per löfte och sort"
        required: false
        default: "8"
      dry_run:
        description: "Bara kandidatlistor — inga modellanrop, ingen skrivning"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: foreslag
  cancel-in-progress: false
jobs:
  foresla:
    runs-on: ubuntu-latest
    # Full körning över alla löften tar timmar (throttle 2,5 s per modellanrop
    # plus källtexthämtning per par) — 120 min räckte inte.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: bambapappa/valflask
          path: valflask-lofter
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: pipeline
      - name: Kontrollera nycklar
        if: ${{ !inputs.dry_run }}
        env:
          HAR_NYCKEL: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAR_MODELL: ${{ vars.MODEL_KOPPLING != '' }}
        run: |
          if [ "$HAR_NYCKEL" != "true" ] || [ "$HAR_MODELL" != "true" ]; then
            echo "Saknas i detta repo: hemligheten OPENROUTER_API_KEY och/eller variabeln MODEL_KOPPLING."
            echo "Lägg in dem under Settings → Secrets and variables → Actions och kör igen."
            exit 1
          fi
      - name: Spara köns startläge
        run: cp data/kopplingsforslag.json /tmp/ko-start.json
      - name: Förslagskörning
        id: kor
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_FALLBACK_BASE_URL: ${{ secrets.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          MODEL_KOPPLING: ${{ vars.MODEL_KOPPLING }}
          MODEL_KOPPLING_FALLBACK: ${{ vars.MODEL_KOPPLING_FALLBACK }}
          LOFTE: ${{ inputs.lofte }}
          MAXK: ${{ inputs.max_kandidater }}
          DRY: ${{ inputs.dry_run }}
        run: |
          args=(--promises ../valflask-lofter/data/promises.json --max-kandidater "$MAXK")
          if [ -n "$LOFTE" ]; then args+=(--lofte "$LOFTE"); else args+=(--alla); fi
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          node --import tsx/esm scripts/foreslag.mts "${args[@]}"
        working-directory: pipeline
      - name: Committa kön (bara körningens nya poster)
        if: ${{ !inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/kopplingsforslag.json /tmp/ko-resultat.json
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH" && git reset --hard "origin/$DEFAULT_BRANCH"
            (cd pipeline && node --import tsx/esm scripts/ko-uppdatera.mts /tmp/ko-start.json /tmp/ko-resultat.json)
            git add data/kopplingsforslag.json
            if git diff --cached --quiet; then
              echo "Inga nya förslag att committa."
              exit 0
            fi
            git commit -m "data: förslagskörning via workflow"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades — gör om från färsk defaultgren..."
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1
      - name: Synka kön till issues
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMISES_PATH: ${{ github.workspace }}/valflask-lofter/data/promises.json
        run: node --import tsx/esm scripts/koppling-issues.mts
        working-directory: pipeline
      - name: Fall röd om körsteget föll
        if: steps.kor.outcome == 'failure'
        run: |
          echo "Förslagskörningen föll — det som hann köas är ändå committat."
          echo "En omkörning prövar de par som föll igen."
          exit 1
