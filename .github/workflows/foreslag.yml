name: foreslag
# Skarpa förslagskörningar (HV2) på GitHubs runners. Kräver i DETTA repo:
#   hemlighet  LLM_API_KEY          (Settings → Secrets and variables → Actions)
#                                   OPENROUTER_API_KEY godtas som alias.
#   variabel   MODEL_KOPPLING       (samma ställe, fliken Variables) — modell-id
#                                   hos primärleverantören (t.ex. Go:
#                                   kimi-k2.7-code — modellkataloger rör sig,
#                                   verifiera mot leverantörens egen lista).
#   variabel   LLM_BASE_URL         primär endpoint, t.ex. OpenCode Go
#                                   https://opencode.ai/zen/go/v1. Utan den
#                                   används OpenRouter.
# Valfria: variabeln LLM_FALLBACK_BASE_URL (secret som reserv), hemligheten
# LLM_FALLBACK_API_KEY (alias LLM_FALLBACK_KEY godtas), och variabeln
# MODEL_KOPPLING_FALLBACK. Löftena läses ur publika valflask.
#
# Körningen är idempotent (par med förslag i kön hoppas över) och pushar
# LÖFTE FÖR LÖFTE: varje klart löftes nya poster läggs på färsk defaultgren
# direkt, så det som gjorts ligger löpande på main och överlever även en hård
# runner-krasch mitt i. Pushloopen lägger bara körningens NYA köposter (via
# scripts/ko-uppdatera.mts) — ett granskningsbeslut som hann fattas under
# körningen återuppstår aldrig. Slutar nyckeln svara bryter körningen efter
# åtta löften i rad utan framsteg. Salvage-committen sist är ett always()-steg
# som flushar det sista löftets delta ÄVEN om jobbet avbryts eller slår i
# timeout-taket (300 min). När committen lyckats synkas kön till issues;
# hoppas det steget över (kort avbrottsfönster) tar koppling-sync.yml det i
# efterhand.
on:
  workflow_dispatch:
    inputs:
      lofte:
        description: "Ett löftes-id (p-2026-XXXX) — tomt = alla aktiva"
        required: false
        default: ""
      max_kandidater:
        description: "Max kandidater per löfte och sort"
        required: false
        default: "8"
      dry_run:
        description: "Bara kandidatlistor — inga modellanrop, ingen skrivning"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: foreslag
  cancel-in-progress: false
jobs:
  foresla:
    runs-on: ubuntu-latest
    # Full körning över alla löften tar timmar (throttle 2,5 s per modellanrop
    # plus källtexthämtning per par) — 120 min räckte inte.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: bambapappa/valflask
          path: valflask-lofter
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: pipeline
      - name: Kontrollera nycklar
        if: ${{ !inputs.dry_run }}
        env:
          HAR_NYCKEL: ${{ (secrets.LLM_API_KEY != '' || secrets.OPENROUTER_API_KEY != '') }}
          HAR_MODELL: ${{ vars.MODEL_KOPPLING != '' }}
        run: |
          if [ "$HAR_NYCKEL" != "true" ] || [ "$HAR_MODELL" != "true" ]; then
            echo "Saknas i detta repo: hemligheten LLM_API_KEY (eller OPENROUTER_API_KEY) och/eller variabeln MODEL_KOPPLING."
            echo "Lägg in dem under Settings → Secrets and variables → Actions och kör igen."
            exit 1
          fi
      - name: Spara köns startläge
        run: cp data/kopplingsforslag.json /tmp/ko-start.json
      - name: Förslagskörning (löfte för löfte, push efter varje)
        # Kör ett löfte i taget och pushar dess resultat till defaultgrenen
        # DIREKT — inte allt på slutet. Då ligger varje klart löfte på main
        # löpande och är oförstörbart även om runnern kraschar mitt i (utöver
        # cancel/timeout, som salvage-steget nedan täcker). Slutar nyckeln
        # svara mitt i tappas inget som redan pushats.
        id: kor
        continue-on-error: true
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Base-URL är inte hemlig — läs den ur variabler i första hand
          # (secrets kvar som reserv). Nyckelnamnet har historiskt stavats
          # LLM_FALLBACK_KEY i detta repo (HANDOFF-varning); godta båda.
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL || secrets.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.LLM_FALLBACK_KEY }}
          MODEL_KOPPLING: ${{ vars.MODEL_KOPPLING }}
          MODEL_KOPPLING_FALLBACK: ${{ vars.MODEL_KOPPLING_FALLBACK }}
          LOFTE: ${{ inputs.lofte }}
          MAXK: ${{ inputs.max_kandidater }}
          DRY: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMISES: ${{ github.workspace }}/valflask-lofter/data/promises.json
        run: |
          # GitHub kör run:-steg som "bash -e" som standard. Med -e PÅ dödar
          # ETT enda misslyckat modellanrop (icke-noll exitkod från
          # foreslag.mts) HELA skriptet direkt — innan fexit=$? och
          # dödspärren (åtta löften i rad) ens hinner köra. Loopen nedan är
          # byggd för att hantera fel explicit via $?, så -e stängs av
          # medvetet; -u och pipefail är kvar (typofel/pipe-fel ska ändå
          # fälla skriptet).
          set -uo pipefail
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Torrkörning skriver ingenting och pushar inte — bara kandidatlistor.
          if [ "$DRY" = "true" ]; then
            args=(--promises "$PROMISES" --max-kandidater "$MAXK")
            if [ -n "$LOFTE" ]; then args+=(--lofte "$LOFTE"); else args+=(--alla); fi
            args+=(--dry-run)
            (cd pipeline && node --import tsx/esm scripts/foreslag.mts "${args[@]}")
            exit $?
          fi

          # Pushar körningens NYA kö-/provade-poster race-säkert mot färsk main
          # (ko-uppdatera lägger bara på det som är nytt sedan startläget,
          # provade-uppdatera unionar). Inget att committa räknas som lyckad
          # push. Efter varje push flyttas startläget fram, så nästa löftes
          # delta blir bara dess egna poster.
          push_delta() {
            cp data/kopplingsforslag.json /tmp/ko-resultat.json
            cp data/provade-par.json /tmp/provade-resultat.json
            for attempt in 1 2 3 4 5; do
              git fetch origin "$DEFAULT_BRANCH" && git reset --hard "origin/$DEFAULT_BRANCH"
              (cd pipeline && node --import tsx/esm scripts/ko-uppdatera.mts /tmp/ko-start.json /tmp/ko-resultat.json)
              (cd pipeline && node --import tsx/esm scripts/provade-uppdatera.mts /tmp/provade-resultat.json)
              git add data/kopplingsforslag.json data/provade-par.json
              if git diff --cached --quiet; then
                cp data/kopplingsforslag.json /tmp/ko-start.json
                return 0
              fi
              git commit -m "data: förslagskörning via workflow (löpande)"
              if git push origin "HEAD:$DEFAULT_BRANCH"; then
                echo "  push lyckades (försök $attempt)"
                cp data/kopplingsforslag.json /tmp/ko-start.json
                return 0
              fi
              echo "  push-försök $attempt misslyckades — gör om från färsk defaultgren..."
              sleep $((attempt * 5))
            done
            echo "  push misslyckades efter 5 försök"
            return 1
          }

          # Löftena att köra: ett givet id, annars alla aktiva ur promises.json.
          if [ -n "$LOFTE" ]; then
            loften="$LOFTE"
          else
            loften="$(jq -r '.[] | select((.status // "aktiv") == "aktiv") | .id' "$PROMISES")"
          fi

          rc=0
          dodstreck=0
          for id in $loften; do
            (cd pipeline && node --import tsx/esm scripts/foreslag.mts \
              --promises "$PROMISES" --lofte "$id" --max-kandidater "$MAXK")
            fexit=$?
            if [ -n "$(git status --porcelain -- data/kopplingsforslag.json data/provade-par.json)" ]; then
              # Löftet gav nya kö-/provade-poster — pusha dem innan nästa löfte.
              push_delta || rc=1
              dodstreck=0
            elif [ "$fexit" != "0" ]; then
              # Föll utan att lämna ett enda avgjort par (t.ex. död nyckel).
              rc=1
              dodstreck=$((dodstreck + 1))
              echo "$id: föll utan framsteg (streck $dodstreck)"
              if [ "$dodstreck" -ge 8 ]; then
                echo "Avbryter: 8 löften i rad föll utan ett enda lyckat modellanrop — trolig nyckel-/kreditkrasch. Det som hann köas är redan pushat löpande."
                break
              fi
            fi
          done
          exit $rc
      - name: Committa kön (slutlig salvage av sista löftet)
        # Körsteget pushar löpande efter varje löfte; detta steg flushar bara
        # det SISTA löftets delta som ännu inte hunnit pushas. always(): det
        # ska landa ÄVEN när jobbet avbryts eller slår i timeout-taket — inte
        # bara på framgångsvägen. På normal avslutning är deltat tomt (allt är
        # redan pushat) och steget blir en no-op.
        id: commit
        if: ${{ always() && !inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/kopplingsforslag.json /tmp/ko-resultat.json
          cp data/provade-par.json /tmp/provade-resultat.json
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH" && git reset --hard "origin/$DEFAULT_BRANCH"
            (cd pipeline && node --import tsx/esm scripts/ko-uppdatera.mts /tmp/ko-start.json /tmp/ko-resultat.json)
            (cd pipeline && node --import tsx/esm scripts/provade-uppdatera.mts /tmp/provade-resultat.json)
            git add data/kopplingsforslag.json data/provade-par.json
            if git diff --cached --quiet; then
              echo "Inget nytt att committa."
              exit 0
            fi
            git commit -m "data: förslagskörning via workflow"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades — gör om från färsk defaultgren..."
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1
      - name: Synka kön till issues
        # Kör så snart committen faktiskt lyckades (även på cancel/timeout-
        # salvagen), men ALDRIG om pushen föll — då finns inga nya poster i
        # main att skapa issues för. Skulle detta steg hoppas över (t.ex. för
        # kort avbrottsfönster) synkas kön i efterhand via koppling-sync.yml.
        if: ${{ always() && !inputs.dry_run && steps.commit.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMISES_PATH: ${{ github.workspace }}/valflask-lofter/data/promises.json
        run: node --import tsx/esm scripts/koppling-issues.mts
        working-directory: pipeline
      - name: Fall röd om körsteget föll
        if: steps.kor.outcome == 'failure'
        run: |
          echo "Förslagskörningen föll — det som hann köas är ändå committat."
          echo "En omkörning prövar de par som föll igen."
          exit 1
