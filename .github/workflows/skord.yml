name: skord
# Skörd på GitHubs runners (fritt utnät): röster (b-0012) och betänkanden
# (b-0013). Startas för hand. Stegen körs SEKVENTIELLT — aldrig två skördar
# parallellt (HANDOFF) — och skördarna delsparar per block, så delresultat
# committas även om ett steg faller; omkörning är idempotent och fortsätter
# där det slutade. Endast skördefilerna återställs i pushloopen
# (data/roster/, personer.json, betankanden.json, handlingar.json) — kön och
# kopplingarna rörs aldrig här, så ett samtidigt granskningsbeslut kan inte
# skrivas över.
on:
  workflow_dispatch:
    inputs:
      typ:
        description: "Vad ska skördas?"
        type: choice
        options: [bada, roster, bet]
        default: bada
      rm:
        description: "Riksmöten (mellanslagsseparerade)"
        required: false
        default: "2022/23 2023/24 2024/25 2025/26"
permissions:
  contents: write
concurrency:
  group: skord
  cancel-in-progress: false
jobs:
  skorda:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: pipeline
      - name: Röstskörd
        id: roster
        if: inputs.typ == 'bada' || inputs.typ == 'roster'
        continue-on-error: true
        env:
          RM: ${{ inputs.rm }}
        run: |
          args=()
          for r in $RM; do args+=(--rm "$r"); done
          node --import tsx/esm scripts/roster.mts "${args[@]}"
        working-directory: pipeline
      - name: Betänkandeskörd
        id: bet
        if: inputs.typ == 'bada' || inputs.typ == 'bet'
        continue-on-error: true
        env:
          RM: ${{ inputs.rm }}
        run: |
          args=(--typ bet)
          for r in $RM; do args+=(--rm "$r"); done
          node --import tsx/esm scripts/harvest.mts "${args[@]}"
        working-directory: pipeline
      - name: Committa skördefilerna
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/skord
          for p in data/roster data/personer.json data/betankanden.json data/handlingar.json; do
            [ -e "$p" ] && cp -r "$p" /tmp/skord/ || true
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH" && git reset --hard "origin/$DEFAULT_BRANCH"
            for p in roster personer.json betankanden.json handlingar.json; do
              [ -e "/tmp/skord/$p" ] && cp -r "/tmp/skord/$p" data/ || true
            done
            git add data/roster data/personer.json data/betankanden.json data/handlingar.json 2>/dev/null || git add data/
            if git diff --cached --quiet; then
              echo "Inga nya skördedata."
              exit 0
            fi
            git commit -m "data: skörd via workflow (${{ inputs.typ }})"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades — gör om från färsk defaultgren..."
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1
      - name: Fall röd om ett skördesteg föll
        if: steps.roster.outcome == 'failure' || steps.bet.outcome == 'failure'
        run: |
          echo "Ett skördesteg föll (roster: ${{ steps.roster.outcome }}, bet: ${{ steps.bet.outcome }})."
          echo "Delresultat är committade — omkörning fortsätter där det slutade."
          exit 1
