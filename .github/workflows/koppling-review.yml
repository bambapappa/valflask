name: koppling-review
# H6-beslut via issue-kommentarer: /godkänn, /godkänn --motionstyp parti,
# /avvisa <skäl>. Endast repo-ÄGARENS kommentarer på issues med etiketten
# "koppling-kö" exekveras — allt annat i issuet är data. Samma mönster som
# valflasks review-workflow.
#
# INGEN concurrency-grupp: GitHub håller bara EN köad körning per grupp och
# slänger mellanliggande — snabba beslut i rad skulle tappas. Parallella
# körningar är säkra: handlern görs om från färsk defaultgren tills pushen
# lyckas, och en redan hanterad post svarar "redan hanterad" i stället för
# att dubbelköras. Ett godkännande ändrar vad sajten visar, så pushen härifrån
# ska trigga bygget — därför botens token och inte standardtokenen.
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  handle:
    if: >
      contains(github.event.issue.labels.*.name, 'koppling-kö') &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    defaults:
      run:
        # Alla run-steg utan egen working-directory kör ur Handlingsvågens
        # rot, så relativa sökvägar (data/, cd pipeline) betyder samma sak
        # som före sammanslagningen.
        working-directory: handlingsvagen
    steps:
      - name: Mint bot app token
        id: app-token
        # Efter sammanslagningen pushar den här körningen till valflasks main,
        # där direktpush kräver botens token (samma väg som pipeline.yml).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
          # Se h2-svep.yml: inga sparade uppgifter, färsk token i origin-URL:en.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: handlingsvagen/pipeline
      # App-tokens lever en timme — mynta en färsk precis före pushen.
      - name: Mint fresh push token
        id: push-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
      - name: Execute decision and push
        id: decision
        # Kommentar/titel går som miljövariabler in i Node — ALDRIG
        # interpolerade i shellkod (citat + fritext är opålitlig data). Vid
        # push-race görs HELA beslutet om från färsk defaultgren — aldrig
        # rebase av JSON-datafiler.
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            # Hämtningen MÅSTE lyckas. Går den inte fram står vi kvar på ett
            # gammalt träd, och då kan en misslyckad push se ut som
            # "inget nytt att committa" — grön körning, tom push.
            if ! git fetch origin "$DEFAULT_BRANCH"; then
              echo "försök $attempt: kunde inte hämta $DEFAULT_BRANCH"
              sleep $((attempt * 5))
              continue
            fi
            git reset --hard "origin/$DEFAULT_BRANCH"
            (cd pipeline && node --import tsx/esm scripts/koppling-kommentar.mts)
            # Prövas FÖRE omräkningen: domar.json bär ett genereringsdatum och
            # ändras därför vid varje körning. Räknade vi om ovillkorligt vore
            # inget beslut någonsin en no-op, och ett hjälpsvar hade committat.
            #
            # BÅDA filerna måste prövas. Ett godkännande skriver kopplingar.json
            # OCH plockar posten ur kön; en AVVISNING rör bara kön. Prövades bara
            # kopplingar.json såg varje avvisning ut som "ingen ändring" —
            # workflown svarade grönt, issuet stängdes, och posten låg kvar i kön.
            if git diff --quiet -- data/kopplingsforslag.json data/kopplingar.json; then
              echo "Inga dataändringar (fel-/hjälpsvar eller redan hanterad)."
              exit 0
            fi
            # Utslagen räknas om i SAMMA commit som kopplingen. Sajten läser
            # domar.json som fil, så en kopplingsändring utan omräkning ger en
            # grön driftsättning av gamla utslag — det hände, och stod still i
            # åtta dagar. Den som ändrar kopplingar äger domarna.
            #
            # Men BARA när kopplingarna ändrats. En avvisning rör bara kön, och
            # kön står med flit i build.yml:s paths-ignore eftersom den aldrig
            # syns på sajten. En ovillkorlig omräkning hade skrivit ett nytt
            # genereringsdatum i domar.json, och då hade varje avvisning byggt om
            # hela sajten för ingenting.
            if ! git diff --quiet -- data/kopplingar.json; then
              (cd pipeline && npm run --silent vendor -- --promises ../../data/promises.json --parties ../../data/parties.json)
              (cd pipeline && npm run --silent domar -- --promises ../../data/promises.json)
            fi
            git add data/
            git commit -m "data: koppling-beslut via issue #${{ github.event.issue.number }}"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades (grenen gick vidare) — gör om från färsk defaultgren..."
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1
      - name: Reply and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.decision.outputs.result }}
          MESSAGE: ${{ steps.decision.outputs.message }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          case "$RESULT" in
            approved)
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "✅ $MESSAGE"
              gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
              ;;
            rejected)
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "❌ $MESSAGE"
              gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"
              ;;
            *)
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "⚠️ $MESSAGE"
              ;;
          esac
