name: nyckelord
# Bygger nyckelordsindexet (b-0014 andra halvan) på GitHubs runners, som har
# öppen väg till data.riksdagen.se (sessionscontainern nekas).
#
# Ingen språkmodell är inblandad: termerna räknas fram deterministiskt i kod,
# så bygget kostar INGENTING av modellkvoten. Dokumenttexterna hämtas, termer
# utvinns och texterna slängs — bara termerna checkas in (b-0014).
#
# Körningen är återupptagbar: redan indexerade handlingar hoppas över och
# skärvorna delsparas löpande, så en avbruten körning fortsätter där den
# slutade. Kör om workflowen tills "kvar att indexera: 0".
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max antal handlingar denna körning (tomt = alla kvarvarande)"
        required: false
        default: ""
      max_termer:
        description: "Antal termer som sparas per dokument"
        required: false
        default: "40"
      om:
        description: "Indexera om även det som redan finns"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nyckelord
  cancel-in-progress: false
jobs:
  indexera:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Alla run-steg utan egen working-directory kör ur Handlingsvågens
        # rot, så relativa sökvägar (data/, cd pipeline) betyder samma sak
        # som före sammanslagningen.
        working-directory: handlingsvagen
    # ~23 600 dokument i artigt tempo (300 ms mellan hämtningar) tar timmar.
    # Kör med --limit i omgångar, eller låt den gå till taket och kör om.
    timeout-minutes: 330
    steps:
      - name: Mint bot app token
        id: app-token
        # Efter sammanslagningen pushar den här körningen till valflasks main,
        # där direktpush kräver botens token (samma väg som pipeline.yml).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: handlingsvagen/pipeline
      - name: Bygg nyckelordsindexet
        id: kor
        continue-on-error: true
        env:
          LIMIT: ${{ inputs.limit }}
          MAXT: ${{ inputs.max_termer }}
          OM: ${{ inputs.om }}
        run: |
          set -uo pipefail
          args=(--max-termer "$MAXT")
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          if [ "$OM" = "true" ]; then args+=(--om); fi
          (cd pipeline && node --import tsx/esm scripts/nyckelord-index.mts "${args[@]}")
      - name: Committa indexet
        # always(): det som hunnit indexeras ska landa ÄVEN om körningen
        # avbryts eller slår i timeout-taket — hämtningarna är dyra i tid
        # och får aldrig kastas bort.
        if: ${{ always() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data/nyckelord)" ]; then
            echo "Inget nytt att committa."
            exit 0
          fi
          cp -r data/nyckelord /tmp/nyckelord-resultat
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH" && git reset --hard "origin/$DEFAULT_BRANCH"
            # Union mot färsk gren: en handling som någon annan hunnit
            # indexera får aldrig försvinna för att den här körningen inte
            # kände till den.
            (cd pipeline && node --import tsx/esm scripts/nyckelord-uppdatera.mts /tmp/nyckelord-resultat)
            git add data/nyckelord
            if git diff --cached --quiet; then
              echo "Inget nytt att committa."
              exit 0
            fi
            git commit -m "data: nyckelordsindex (b-0014)"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades — gör om från färsk defaultgren..."
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1
      - name: Fall röd om indexbygget föll
        if: ${{ steps.kor.outcome != 'success' }}
        run: |
          echo "Indexbygget föll — det som hann indexeras är ändå committat."
          echo "Kör om workflowen; redan indexerade handlingar hoppas över."
          exit 1
