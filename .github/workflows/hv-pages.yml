name: hv-pages
# Bygger och testar Handlingsvågens sajt på begäran. INGEN DRIFTSÄTTNING.
#
# Workflown hade tidigare ett gatead deploy-steg mot ett eget Cloudflare
# Pages-projekt. Två beslut tog bort det:
#
#   b-0024 — värden är GitHub Pages, inte Cloudflare Pages. Cloudflare Pages
#            fanns i planen bara därför att GitHub Pages från ett privat repo
#            kräver betalplan, och repot öppnas vid lanseringen.
#   b-0025 — Handlingsvågen ligger på SÖKVÄGEN utlovat.se/handlingsvagen, i
#            samma bygge och på samma custom-domän som Fläskvågen. Det finns
#            därför ingen egen sajt att driftsätta: lanseringen sker när
#            repona slås ihop och det sammanslagna trädet publiceras
#            (SAMMANSLAGNING.md steg 4).
#
# Det som återstår här är validering: grönt = sajten är driftsättningsbar.
# Kör den efter varje dataändring. Ingenting publikt rörs — det finns inte
# längre någon väg härifrån till en publik adress, vilket också är avsikten:
# privatgrinden ska inte kunna släppas av ett workflow-argument.
#
# Sajten bär `noindex` tills grinden släpps vid lanseringen.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hv-pages
  cancel-in-progress: false
jobs:
  bygg-och-testa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: pipeline
      - name: Pipeline-tester + typkontroll
        run: |
          npm test
          npm run typecheck
        working-directory: pipeline
      - name: Install site deps
        run: npm ci
        working-directory: site
      - name: Sajtens grindar (budget + struktur)
        run: npm test
        working-directory: site
      - name: Bygg sajten
        run: npm run build
        working-directory: site
      - name: Kontrollera att basstigen sitter (b-0025)
        # Basstigen är lätt att tappa vid en configändring, och utan den pekar
        # varje länk på fel adress efter sammanslagningen. Grinden kostar
        # ingenting och fäller direkt i stället för vid lanseringen.
        run: |
          if ! grep -q 'href="/handlingsvagen/"' site/dist/index.html; then
            echo "::error::Förstasidan saknar länkar under /handlingsvagen/ — basstigen i astro.config.mjs har tappats (b-0025)."
            exit 1
          fi
          if ! grep -q 'data-api-base="/handlingsvagen/"' site/dist/index.html; then
            echo "::error::Sökrutans API-bas pekar inte på /handlingsvagen/ — söket skulle sluta svara efter sammanslagningen."
            exit 1
          fi
          echo "Basstigen sitter: länkar och sökets API-bas ligger under /handlingsvagen/."
