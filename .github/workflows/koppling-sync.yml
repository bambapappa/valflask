name: koppling-sync
# Manuell synk av kopplingskön → GitHub-issues i det här repot. Körs när kön
# fyllts på (efter en foreslag-körning). Efter sammanslagningen ligger
# granskningsflödet i samma repo som löftena, och löftestexterna läses direkt
# ur data/promises.json i stället för ur en utcheckning bredvid.
on:
  workflow_dispatch:
    inputs:
      cap:
        description: "Max antal issues att skapa denna körning"
        required: false
        default: "60"
permissions:
  contents: read
  issues: write
concurrency:
  group: koppling-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Alla run-steg utan egen working-directory kör ur Handlingsvågens
        # rot, så relativa sökvägar (data/, cd pipeline) betyder samma sak
        # som före sammanslagningen.
        working-directory: handlingsvagen
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: handlingsvagen/pipeline
      - name: Sync koppling-kö till issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_CAP: ${{ inputs.cap }}
          PROMISES_PATH: ${{ github.workspace }}/data/promises.json
        run: node --import tsx/esm scripts/koppling-issues.mts
        working-directory: handlingsvagen/pipeline
