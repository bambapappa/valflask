name: jamfor
# Engångsjämförelse: kör ett givet urval REDAN AVGJORDA par (av deepseek-v4-pro
# via opencode Go) om igen mot en ny modell, för att se om modellbytet dömer
# konsekvent på samma indata. Rör ALDRIG produktionsfilerna
# (kopplingsforslag.json, provade-par.json) och skapar inga GitHub-issues —
# se pipeline/scripts/jamfor-modeller.mts. Resultatet committas som en egen,
# tydligt daterad fil under data/, inte en del av granskningsflödet.
#
# Kräver samma inställningar som foreslag.yml:s primar=zai-glm-läge:
#   hemlighet  LLM_ZAI_API_KEY
#   variabel   LLM_ZAI_BASE_URL
#   variabel   MODEL_KOPPLING_ZAI
on:
  workflow_dispatch:
    inputs:
      urval:
        description: "Sökväg till urvalsfilen (par att jämföra)"
        required: false
        default: "data/jamforelse-urval-2026-07-30.json"
      ut:
        description: "Sökväg dit jämförelseresultatet skrivs"
        required: false
        default: "data/modelljamforelse-2026-07-30.json"
permissions:
  contents: write
concurrency:
  group: jamfor
  cancel-in-progress: false
jobs:
  jamfor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: bambapappa/valflask
          path: valflask-lofter
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: Install pipeline deps
        run: npm ci
        working-directory: pipeline
      - name: Kör jämförelsen mot zai-glm
        env:
          LLM_BASE_URL: ${{ vars.LLM_ZAI_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_ZAI_API_KEY }}
          MODEL_KOPPLING: ${{ vars.MODEL_KOPPLING_ZAI }}
        run: |
          node --import tsx/esm scripts/jamfor-modeller.mts \
            --urval "${{ github.workspace }}/${{ inputs.urval }}" \
            --promises "${{ github.workspace }}/valflask-lofter/data/promises.json" \
            --ut "${{ github.workspace }}/${{ inputs.ut }}"
        working-directory: pipeline
      - name: Committa jämförelseresultatet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.ut }}"
          if git diff --cached --quiet; then
            echo "Inget nytt att committa."
            exit 0
          fi
          git commit -m "data: modelljämförelse deepseek-v4-pro vs ${{ vars.MODEL_KOPPLING_ZAI }}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
              echo "Push lyckades (försök $attempt)."
              exit 0
            fi
            echo "Push-försök $attempt misslyckades — hämtar om och lägger på nytt..."
            git fetch origin "${{ github.event.repository.default_branch }}"
            git rebase "origin/${{ github.event.repository.default_branch }}" || exit 1
            sleep $((attempt * 5))
          done
          echo "Push misslyckades efter 5 försök."
          exit 1
